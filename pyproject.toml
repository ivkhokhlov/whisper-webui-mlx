[tool.poetry]
name = "mlx-ui"
version = "0.1.48"
description = ""
authors = ["Ivan Khokhlov <ivan.s.khokhlov@rt.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12.3,<3.13"
fastapi = "^0.121.3"
starlette = ">=0.49.1,<0.51"
jinja2 = "^3.1.4"
uvicorn = "^0.42.0"
python-multipart = "^0.0.21"

[tool.poetry.group.dev.dependencies]
httpx = "^0.28.1"
pytest = "^8.3.4"
ruff = "^0.14.13"

# Engine dependencies are owned by requirements-*.txt profiles, selected by
# setup_and_run.sh and build_embedded_runtime.py for the target platform.
# Poetry locks the common web app and development tools only.

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
